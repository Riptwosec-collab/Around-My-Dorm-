name: Nav Frame Regression

on:
  push:
    branches:
      - feat/around-my-dorm-v2-phase2b-food-now

jobs:
  nav-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run nav alignment regression
        run: npx playwright test e2e/premium-interactions.spec.ts
