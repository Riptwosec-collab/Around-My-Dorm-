name: Strict Manual Google Maps

on:
  push:
    paths:
      - scripts/apply-strict-manual-google-maps.py
      - .github/workflows/strict-manual-google-maps.yml
      - components/ManualGoogleMap.tsx
      - components/GoogleMapsUsageDashboard.tsx
      - components/GoogleMapsMap.tsx
      - components/AroundMyDormApp.tsx
      - components/GoogleDiscoverySheet.tsx
      - components/GooglePlaceIdManager.tsx
      - components/GoogleMaintenancePanel.tsx
      - components/DataManagement.tsx
      - lib/google-map-cost-control.ts
      - lib/google-maps.ts
      - lib/google-live.ts
      - lib/google-request-manager.ts
      - tests/google-map-cost-control.test.ts
      - tests/google-manual-request-architecture.test.ts
      - e2e/manual-google-maps.spec.ts
      - e2e/map-functional.spec.ts
      - .env.example
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strict-manual-google-maps
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply strict manual Google Maps migration
        run: python3 scripts/apply-strict-manual-google-maps.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and architecture tests
        run: npm test
      - name: Validate place dataset
        run: npm run validate:data
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Manual Google Maps E2E
        run: npm run test:e2e
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example README.md \
            components/ManualGoogleMap.tsx components/GoogleMapsUsageDashboard.tsx \
            components/GoogleMapsMap.tsx components/AroundMyDormApp.tsx \
            components/GoogleDiscoverySheet.tsx components/GooglePlaceIdManager.tsx \
            components/GoogleMaintenancePanel.tsx components/DataManagement.tsx \
            lib/google-map-cost-control.ts lib/google-maps.ts lib/google-live.ts \
            lib/google-request-manager.ts tests/google-map-cost-control.test.ts \
            tests/google-manual-request-architecture.test.ts \
            e2e/manual-google-maps.spec.ts e2e/map-functional.spec.ts
          if git diff --cached --quiet; then
            echo "No migration diff"
            exit 0
          fi
          git commit -m "Enforce strict manual Google Maps cost control"
          git push
