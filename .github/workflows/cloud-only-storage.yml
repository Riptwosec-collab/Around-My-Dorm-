name: Cloud Only Storage

on:
  push:
    paths:
      - scripts/apply-cloud-only-storage.py
      - .github/workflows/cloud-only-storage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-only-storage
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply cloud-only storage migration
        run: python3 scripts/apply-cloud-only-storage.py
      - name: Install Supabase client and dependencies
        run: npm install @supabase/supabase-js --save --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and architecture tests
        run: npm test
      - name: Validate place dataset
        run: npm run validate:data
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile and API-lock E2E
        run: npm run test:e2e
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated cloud-only migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json components lib tests .env.example
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Move Around My Dorm application state to Supabase only"
          git push
