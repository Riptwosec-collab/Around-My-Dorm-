name: Fix Navigation Jank

on:
  push:
    paths:
      - '.github/workflows/fix-navigation-jank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply smooth navigation fixes
        run: python scripts/fix-navigation-jank.py

      - name: Install dependencies
        run: npm ci

      - name: Validate optimized app
        run: |
          npm run lint
          npm run typecheck
          npm run validate:data
          npm test
          npm run build
          npx wrangler deploy --dry-run

      - name: Commit optimized navigation
        run: |
          rm -f .github/workflows/fix-navigation-jank.yml scripts/fix-navigation-jank.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A components/AroundMyDormApp.tsx components/GoogleMapsMap.tsx app/globals.css .github/workflows/fix-navigation-jank.yml scripts/fix-navigation-jank.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix tab navigation flicker and mobile jank"
          git push origin HEAD:main
