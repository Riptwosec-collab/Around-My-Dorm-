name: Apply Production Architecture Upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-production-architecture-upgrade.py
      - .github/workflows/production-architecture-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply production architecture upgrade
        run: python3 scripts/apply-production-architecture-upgrade.py

      - name: Scope Vitest to unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vitest.config.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'test: { environment: "jsdom", setupFiles: ["./tests/setup.ts"] }',
              'test: { include: ["tests/**/*.test.ts"], exclude: ["e2e/**", "node_modules/**"], environment: "jsdom", setupFiles: ["./tests/setup.ts"] }',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install and lock dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate production data
        run: npm run validate:data

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run

      - name: Commit production upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No upgrade changes to commit.'
            exit 0
          fi
          git commit -m 'Complete production architecture, routing, map and PWA upgrade'
          git push origin HEAD:main
