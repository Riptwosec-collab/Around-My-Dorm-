name: Apply precise GPS fix once

on:
  push:
    paths:
      - .github/workflows/fix-precise-gps-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch real-device GPS acquisition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/AroundMyDormApp.tsx')
          text = path.read_text()

          old = '''  function useMyLocation() {
    if (!navigator.geolocation) {
      setLocationError(settings.language === "en" ? "Location is not supported on this device" : "อุปกรณ์นี้ไม่รองรับ Location");
      return;
    }
    setLocationError(null);
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const center = { lat: position.coords.latitude, lng: position.coords.longitude };
        setOrigin(center); setMapSearchCenter(center); setOriginMode("me"); setSettings((current) => ({ ...current, homeMode: "me" }));
      },
      () => setLocationError(settings.language === "en" ? "Location permission was not granted" : "ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาอนุญาต Location ใน Safari/Browser"),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 },
    );
  }
'''

          new = '''  function useMyLocation() {
    if (!navigator.geolocation) {
      setLocationError(settings.language === "en" ? "Location is not supported on this device" : "อุปกรณ์นี้ไม่รองรับ Location");
      return;
    }

    // Never accept a stale/coarse network estimate as the user's real position.
    // watchPosition gives GPS/Wi-Fi positioning time to converge to the best sample.
    setLocationError(null);
    const targetAccuracyMeters = 80;
    const acceptableAccuracyMeters = 250;
    const maxWaitMs = 15000;
    const startedAt = Date.now();
    let watchId: number | null = null;
    let timeoutId: number | null = null;
    let settled = false;
    let bestPosition: GeolocationPosition | null = null;

    const cleanup = () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timeoutId !== null) window.clearTimeout(timeoutId);
    };

    const applyPosition = (position: GeolocationPosition) => {
      if (settled) return;
      settled = true;
      cleanup();
      const center = { lat: position.coords.latitude, lng: position.coords.longitude };
      setOrigin(center);
      setMapSearchCenter(center);
      setPendingMapCenter(null);
      setShowSearchArea(false);
      setSelectedPlace(null);
      setOriginMode("me");
      setSettings((current) => ({ ...current, homeMode: "me" }));
      setLocationError(null);
      showToast(
        settings.language === "en"
          ? `GPS locked · ±${Math.round(position.coords.accuracy)} m`
          : `จับตำแหน่งจริงแล้ว · แม่นยำประมาณ ±${Math.round(position.coords.accuracy)} ม.`,
      );
      void logRuntimeEventCloud("gps_lock", {
        accuracyMeters: Math.round(position.coords.accuracy),
        elapsedMs: Date.now() - startedAt,
      }).catch(() => undefined);
    };

    const failWithAccuracy = () => {
      if (settled) return;
      settled = true;
      cleanup();
      const accuracy = bestPosition ? Math.round(bestPosition.coords.accuracy) : null;
      setLocationError(
        settings.language === "en"
          ? accuracy
            ? `Location is still too approximate (±${accuracy} m). Enable Precise Location for this site and try again.`
            : "Could not get a precise GPS fix. Enable Precise Location for this site and try again."
          : accuracy
            ? `ตำแหน่งยังคลาดเคลื่อนมาก (±${accuracy} ม.) กรุณาเปิด “ตำแหน่งที่ตั้งแบบแม่นยำ/Precise Location” ให้เว็บนี้ แล้วลองใหม่`
            : `ยังจับ GPS แบบแม่นยำไม่ได้ กรุณาเปิด “ตำแหน่งที่ตั้งแบบแม่นยำ/Precise Location” ให้เว็บนี้ แล้วลองใหม่`,
      );
    };

    timeoutId = window.setTimeout(() => {
      if (bestPosition && bestPosition.coords.accuracy <= acceptableAccuracyMeters) {
        applyPosition(bestPosition);
      } else {
        failWithAccuracy();
      }
    }, maxWaitMs);

    watchId = navigator.geolocation.watchPosition(
      (position) => {
        if (!Number.isFinite(position.coords.latitude) || !Number.isFinite(position.coords.longitude)) return;
        if (!bestPosition || position.coords.accuracy < bestPosition.coords.accuracy) bestPosition = position;

        if (position.coords.accuracy <= targetAccuracyMeters) {
          applyPosition(position);
          return;
        }

        // Give GPS a few seconds to refine before accepting a still-reasonable fix.
        if (Date.now() - startedAt >= 5000 && position.coords.accuracy <= acceptableAccuracyMeters) {
          applyPosition(position);
        }
      },
      (error) => {
        if (bestPosition && bestPosition.coords.accuracy <= acceptableAccuracyMeters) {
          applyPosition(bestPosition);
          return;
        }
        if (settled) return;
        settled = true;
        cleanup();
        const denied = error.code === error.PERMISSION_DENIED;
        setLocationError(
          settings.language === "en"
            ? denied
              ? "Location access is blocked. Allow Precise Location for this site in browser/system settings."
              : "Could not get a precise GPS fix. Check Location Services and try again."
            : denied
              ? "สิทธิ์ตำแหน่งถูกบล็อก กรุณาอนุญาต Location และเปิด Precise Location ให้เว็บนี้ใน Browser/ระบบ"
              : "จับ GPS แบบแม่นยำไม่ได้ กรุณาตรวจสอบ Location Services แล้วลองใหม่",
        );
      },
      { enableHighAccuracy: true, timeout: maxWaitMs, maximumAge: 0 },
    );
  }
'''

          if old not in text:
              raise SystemExit('Expected useMyLocation block was not found; refusing unsafe patch')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-precise-gps-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AroundMyDormApp.tsx .github/workflows/fix-precise-gps-once.yml
          git commit -m "fix: require precise live GPS position"
          git push origin HEAD:main
