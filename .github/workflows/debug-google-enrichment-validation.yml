name: Debug Google Enrichment Root Cause

on:
  push:
    branches:
      - debug/google-enrichment-root-cause
    paths:
      - scripts/apply-google-enrichment-diagnostics.py
      - .github/workflows/debug-google-enrichment-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-google-enrichment-root-cause
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply root-cause instrumentation
        run: python3 scripts/apply-google-enrichment-diagnostics.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated instrumentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/google-request-manager.ts lib/google-cloud-enrichment.ts components/GoogleCloudAutoEnrichment.tsx
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Instrument Google enrichment root cause and stop systemic retry loops'
          git push origin debug/google-enrichment-root-cause
