name: Migrate Google Maps Database First

on:
  push:
    paths:
      - '.github/workflows/migrate-google-maps-database-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Google Maps runtime migration
        run: python scripts/migrate-google-maps-runtime.py

      - name: Install dependencies
        run: npm ci

      - name: Validate Google implementation before Mapbox removal
        run: |
          npm run lint
          npm run typecheck
          npm run validate:data
          npm test
          npm run build

      - name: Remove validated Mapbox runtime
        run: |
          rm -f components/MapboxMap.tsx
          rm -f .github/workflows/apply-mapbox-database-first.yml
          sed -i '/mapbox-gl\/dist\/mapbox-gl.css/d' app/globals.css
          sed -i 's/Mapbox is used as the map engine only/Google Maps is used as the map engine only/g; s/Mapbox ใช้เป็น Map Engine เท่านั้น/Google Maps ใช้เป็น Map Engine เท่านั้น/g' components/DataManagement.tsx
          npm uninstall mapbox-gl

      - name: Validate final Google-only runtime
        run: |
          npm run lint
          npm run typecheck
          npm run validate:data
          npm test
          npm run build
          npx wrangler deploy --dry-run
          if grep -Rni --exclude='README.md' --exclude='*.yml' --exclude='*.yaml' --exclude='package-lock.json' --exclude='migrate-google-maps-runtime.py' 'mapbox' app components lib package.json 2>/dev/null; then
            echo 'Unexpected Mapbox runtime reference remains'
            exit 1
          fi

      - name: Cleanup migration helpers
        run: |
          rm -f scripts/migrate-google-maps-runtime.py
          rm -f .github/workflows/migrate-google-maps-database-first.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Migrate map runtime from Mapbox to Google Maps"
            git push
          fi
