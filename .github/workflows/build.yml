name: Build Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload unit test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-unit-test-output
          path: unit-test-output.log
          if-no-files-found: warn

      - name: Enforce unit test result
        if: steps.unit-tests.outputs.exit_code != '0'
        run: exit 1

      - name: Type check
        run: npm run typecheck

      - name: Build production
        run: npm run build

      - name: Validate Cloudflare Workers bundle
        run: npx wrangler deploy --dry-run
