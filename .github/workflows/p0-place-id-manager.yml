name: P0 Place ID Manager

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-p0-place-id-manager.py'
      - 'scripts/fix-p0-place-id-manager.py'
      - 'scripts/fix-p0-place-id-e2e.py'
      - '.github/workflows/p0-place-id-manager.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  place-id-manager:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Place ID Manager
        run: python3 scripts/apply-p0-place-id-manager.py
      - name: Stabilize Place ID Manager type inference
        run: python3 scripts/fix-p0-place-id-manager.py
      - name: Stabilize mobile Place ID Manager test selector
        run: python3 scripts/fix-p0-place-id-e2e.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate place data
        run: npm run validate:data
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile Place ID Manager safety test
        run: npx playwright test e2e/p0-place-id-manager.spec.ts
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated Place ID Manager
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/GooglePlaceIdManager.tsx components/DataManagement.tsx lib/google-place-id-manager.ts lib/storage/google-place-matches.ts tests/google-place-id-manager.test.ts e2e/p0-place-id-manager.spec.ts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Implement P0 Google Place ID Manager'
          git push origin main
