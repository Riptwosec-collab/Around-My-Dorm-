name: Apply Product Upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-main-upgrade.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply safe patch
        run: node scripts/apply-main-upgrade.mjs
      - name: Install dependencies
        run: npm install
      - name: Validate TypeScript and production build
        run: npm run check
      - name: Commit upgraded app
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AroundMyDormApp.tsx
          git commit -m "Integrate local discovery product upgrade"
          git push
