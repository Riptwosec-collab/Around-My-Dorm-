name: Phase2B Search Focus Fix

on:
  push:
    branches:
      - feat/around-my-dorm-v2-phase2b-food-now

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/around-my-dorm-v2-phase2b-food-now
      - name: Apply bounded focus fix
        run: python scripts/phase2b_search_focus_fix.py
      - name: Commit focus fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/AroundMyDormApp.tsx
          git commit -m "fix: reopen Search Assist while editing [search-focus-fix]"
          git push origin HEAD:feat/around-my-dorm-v2-phase2b-food-now
