name: Google Cloud Auto Enrichment

on:
  push:
    branches: [main]
    paths:
      - 'lib/google-cloud-enrichment.ts'
      - 'components/GoogleCloudAutoEnrichment.tsx'
      - 'tests/google-cloud-enrichment.test.ts'
      - 'scripts/apply-google-cloud-auto-enrichment.py'
      - '.github/workflows/google-cloud-auto-enrichment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-cloud-auto-enrichment-main
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply integration patch
        run: python3 scripts/apply-google-cloud-auto-enrichment.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate place data
        run: npm run validate:data
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/DataManagement.tsx lib/database/places.ts lib/storage/google-place-matches.ts
          if git diff --cached --quiet; then
            echo 'No generated integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate one-click Google to Supabase enrichment'
          git push origin main
