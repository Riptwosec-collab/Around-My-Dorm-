name: Retry Google review details map patch

on:
  push:
    branches: [fix/google-review-details-map]
    paths: [.github/workflows/retry-google-review-details-map.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-review-details-map
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply corrected targeted patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/patch-google-review-details-map.yml").read_text()
          start = workflow.index("        run: |\n", workflow.index("- name: Patch only the broken enrichment module")) + len("        run: |\n")
          end = workflow.index("      - run: npm ci --no-audit --no-fund", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace('source: "google_candidate_review",', 'source: "google_places_admin",')
          exec(compile(script, "targeted-google-review-patch", "exec"))
      - run: npm ci --no-audit --no-fund
      - run: npm test -- tests/google-cloud-enrichment.test.ts
      - run: npm test
      - run: npm run typecheck
      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/google-cloud-enrichment.ts
          git commit -m "fix: populate review candidate details and map coordinates"
          git push origin HEAD:fix/google-review-details-map
