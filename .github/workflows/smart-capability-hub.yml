name: Smart Capability Hub

on:
  push:
    paths:
      - components/SmartCapabilityHub.tsx
      - lib/smart-capabilities.ts
      - lib/cloud/capabilities.ts
      - lib/cloud/store.ts
      - scripts/apply-smart-capability-hub.py
      - tests/smart-capabilities.test.ts
      - .github/workflows/smart-capability-hub.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-capability-hub
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integration
        run: python3 scripts/apply-smart-capability-hub.py
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Validate data
        run: npm run validate:data
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Mobile and zero accidental Google Places E2E
        run: npm run test:e2e
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AroundMyDormApp.tsx
          if git diff --cached --quiet; then
            echo "No integration diff"
            exit 0
          fi
          git commit -m "Integrate smart local concierge capabilities"
          git push
