name: Visual UX Finishing Upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-visual-ux-upgrade.py
      - scripts/fix-visual-regression-test.py
      - .github/workflows/visual-ux-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply visual UX upgrade
        run: python3 scripts/apply-visual-ux-upgrade.py

      - name: Stabilize visual regression test
        run: python3 scripts/fix-visual-regression-test.py

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate production data
        run: npm run validate:data

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive and routing E2E
        run: npm run test:e2e

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run

      - name: Commit visual UX upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AroundMyDormApp.tsx components/PlaceDetail.tsx e2e/visual-regression.spec.ts package-lock.json
          if git diff --cached --quiet; then
            echo 'No visual UX changes to commit.'
            exit 0
          fi
          git commit -m 'Finish premium visual, motion and responsive UX upgrade'
          git push origin HEAD:main
