name: Patch Cloud Only App

on:
  push:
    branches: [fix/admin-login-cloud-only]
    paths:
      - 'scripts/patch-cloud-only-app.py'
      - '.github/workflows/patch-cloud-only-app.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch app runtime
        run: python3 scripts/patch-cloud-only-app.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          npm test
          npm run typecheck
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AroundMyDormApp.tsx
          git commit -m 'fix: use Supabase as the only runtime place source'
          git push origin fix/admin-login-cloud-only
