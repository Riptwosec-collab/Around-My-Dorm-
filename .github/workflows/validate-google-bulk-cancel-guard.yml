name: Validate Google Bulk Cancel Guard

on:
  push:
    branches:
      - fix/google-bulk-cancel-guard
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- tests/google-cloud-auto-enrichment-cancel.test.ts
