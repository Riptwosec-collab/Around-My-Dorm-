name: Probe Production Anonymous Auth Once

on:
  push:
    branches:
      - debug/probe-google-enrichment-production
    paths:
      - .github/workflows/probe-google-enrichment-production.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture passive Data Management failures without Google calls
        env:
          TARGET_URL: https://around-my-dorm.aidsaras.workers.dev
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const events = [];
            const google = [];
            const stamp = () => new Date().toISOString();
            page.on('pageerror', (error) => events.push(`${stamp()} PAGEERROR ${error.stack || error.message}`));
            page.on('console', (msg) => {
              if (msg.type() === 'error') events.push(`${stamp()} CONSOLE ${msg.text()}`);
            });
            page.on('request', (request) => {
              const url = request.url();
              if (url.includes('maps.googleapis.com') || url.includes('places.googleapis.com')) google.push(url);
            });
            page.on('response', async (response) => {
              if (response.status() < 400) return;
              const url = response.url();
              if (!url.includes('supabase.co')) return;
              let body = '';
              try { body = (await response.text()).slice(0, 2000); } catch {}
              events.push(`${stamp()} HTTP ${response.status()} ${response.request().method()} ${url.replace(/apikey=[^&]+/ig, 'apikey=[REDACTED]')} BODY=${body}`);
            });

            events.push(`${stamp()} STEP goto-settings`);
            await page.goto(`${process.env.TARGET_URL}/settings/`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1500);
            events.push(`${stamp()} STEP open-data-management`);
            await page.getByRole('button', { name: 'จัดการ', exact: true }).click();
            await page.getByTestId('google-maps-usage-dashboard').waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForTimeout(5000);
            events.push(`${stamp()} STEP done`);

            console.log('=== TIMELINE ===');
            for (const value of events) console.log(value.replace(/AIza[0-9A-Za-z_-]{20,}/g, '[REDACTED_GOOGLE_API_KEY]'));
            console.log('=== GOOGLE REQUESTS ===');
            console.log(google.length);
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
