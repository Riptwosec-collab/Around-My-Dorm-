name: Patch Rich Google Details

on:
  push:
    branches: [feature/hybrid-google-platform]
    paths:
      - scripts/patch-rich-google-details.py
      - .github/workflows/patch-rich-google-details.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/patch-rich-google-details.py
      - name: Install
        run: npm install
      - name: Unit tests
        run: npm test -- tests/google-cloud-enrichment.test.ts tests/google-place-details.test.ts
      - name: Type check
        run: npm run typecheck
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/google-cloud-enrichment.ts
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'feat: cache richer Google place metadata safely'
          git push origin feature/hybrid-google-platform
