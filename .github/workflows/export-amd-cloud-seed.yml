name: Export AMD Cloud Seed

on:
  push:
    paths:
      - scripts/export-amd-cloud-seed.ts
      - .github/workflows/export-amd-cloud-seed.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-amd-cloud-seed
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export canonical 91-place seed
        run: npx tsx scripts/export-amd-cloud-seed.ts
      - name: Validate dataset
        run: npm run validate:data
      - name: Type check
        run: npm run typecheck
      - name: Commit seed batches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/seed/amd_places
          if git diff --cached --quiet; then
            echo "No seed changes"
            exit 0
          fi
          git commit -m "Export canonical 91-place Supabase seed"
          git push
