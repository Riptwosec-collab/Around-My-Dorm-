name: Fix Manual Google Request Summary

on:
  push:
    paths:
      - '.github/workflows/fix-manual-google-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Correct estimated vs actual request summary
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/GoogleMaintenancePanel.tsx')
          s = p.read_text()
          old = '["Estimated", result.logicalRequests], ["Attempted", result.logicalRequests], ["Succeeded", result.succeeded], ["Failed", result.failed], ["Retries", result.retries], ["Network attempts", result.networkAttempts],'
          new = '["Logical lookups", result.logicalRequests], ["Actually attempted", result.networkAttempts], ["Succeeded", result.succeeded], ["Failed", result.failed], ["Retries", result.retries], ["Network attempts", result.networkAttempts],'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('request summary anchor not found')
          p.write_text(s)
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run validate:data
          npm test
          npm run build
          npx wrangler deploy --dry-run
      - name: Commit correction
        run: |
          rm -f .github/workflows/fix-manual-google-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GoogleMaintenancePanel.tsx .github/workflows/fix-manual-google-summary.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Google request actual usage summary"
          git push origin HEAD:main
