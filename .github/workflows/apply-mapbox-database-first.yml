name: Apply Mapbox Database First

on:
  push:
    paths:
      - '.github/workflows/apply-mapbox-database-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply database-first Mapbox migration
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # package.json: Mapbox GL becomes the map engine; Google marker runtime package is removed.
          p = Path('package.json')
          package = json.loads(p.read_text())
          deps = package.setdefault('dependencies', {})
          deps.pop('@googlemaps/markerclusterer', None)
          deps['mapbox-gl'] = '^3.21.0'
          p.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          # Environment contract.
          Path('.env.example').write_text('''# Mapbox is the runtime map engine only.\n# Restrict the public token to the production domains in Mapbox.\nNEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=YOUR_MAPBOX_PUBLIC_TOKEN\n\n# Optional persistent Around My Dorm database. If omitted, the normalized embedded\n# dataset remains the database fallback and normal browsing still makes no POI calls.\nNEXT_PUBLIC_SUPABASE_URL=\nNEXT_PUBLIC_SUPABASE_ANON_KEY=\n\n# Maintenance/import only. Never expose a real provider key to the browser and never\n# persist provider fields unless the applicable provider policy explicitly allows it.\nGOOGLE_PLACES_API_KEY=\n''')

          # Mapbox CSS must load globally.
          p = Path('app/globals.css')
          s = p.read_text()
          if '@import "mapbox-gl/dist/mapbox-gl.css";' not in s:
              s = s.replace('@import "tailwindcss";\n', '@import "tailwindcss";\n@import "mapbox-gl/dist/mapbox-gl.css";\n')
          p.write_text(s)

          # Extend place governance metadata without removing legacy fields.
          p = Path('types/place.ts')
          s = p.read_text()
          if 'sourceId?: string | null;' not in s:
              s = s.replace('  source: string[];\n', '  source: string[];\n  sourceId?: string | null;\n  sourceUrl?: string | null;\n  lastChecked?: string | null;\n  lastUpdated?: string | null;\n')
          if 'hiddenGem?: boolean;' not in s:
              s = s.replace('  localFavorite: boolean;\n', '  localFavorite: boolean;\n  hiddenGem?: boolean;\n')
          p.write_text(s)

          # Upgrade Mapbox renderer to Standard Night, current recommended basemap.
          p = Path('components/MapboxMap.tsx')
          s = p.read_text()
          s = s.replace('style: "mapbox://styles/mapbox/dark-v11",', 'style: "mapbox://styles/mapbox/standard",\n          config: { basemap: { lightPreset: "night", theme: "monochrome", showPointOfInterestLabels: false, showTransitLabels: false, show3dObjects: false } },')
          p.write_text(s)

          # Main app migration.
          p = Path('components/AroundMyDormApp.tsx')
          s = p.read_text()
          s = s.replace('import { MarkerClusterer } from "@googlemaps/markerclusterer";\n', '')
          s = s.replace('  Compass,\n  Filter,', '  Compass,\n  Database,\n  Filter,')
          s = s.replace('import { GOOGLE_PLACE_FIELDS, loadGoogleMaps, mapGooglePlace } from "@/lib/google-maps";\n', '')
          s = s.replace('import { getGooglePlacesCache, makeGooglePlacesCacheKey, setGooglePlacesCache } from "@/lib/google-places-cache";\n', '')
          s = s.replace('import { LEGACY_DARK_MAP_STYLES } from "@/lib/map-style";\n', '')
          s = s.replace('import { mergePlaceImageData } from "@/lib/place-images";\n', '')
          if 'import { MapboxMap }' not in s:
              s = s.replace('import { MapBottomSheet } from "@/components/MapBottomSheet";\n', 'import { MapBottomSheet } from "@/components/MapBottomSheet";\nimport { MapboxMap } from "@/components/MapboxMap";\nimport { DataManagement } from "@/components/DataManagement";\nimport { loadPlacesFromDatabase } from "@/lib/database/places";\n')
          s = s.replace('  dedupePlaces,\n', '')

          s = re.sub(r'const TARGET_GOOGLE_TYPES = \[.*?\];\n\n', '', s, flags=re.S)
          s = re.sub(r'const MARKER_COLORS: Record<string, string> = \{.*?\};\n\n', '', s, flags=re.S)
          s = re.sub(r'function mergeSeedAndLive\(seedPlaces: Place\[], livePlaces: Place\[]\) \{.*?\n\}\n\n(?=function activeFilterCount)', '', s, flags=re.S)

          s = s.replace('  const apiKey = process.env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY ?? "";\n  const mapId = process.env.NEXT_PUBLIC_GOOGLE_MAP_ID ?? "";\n', '  const mapboxToken = process.env.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN ?? "";\n')
          s = s.replace('  const [apiReady, setApiReady] = useState(false);\n  const [mapLoadState, setMapLoadState] = useState<MapLoadState>(apiKey ? "idle" : "missing");\n  const [loadingPlaces, setLoadingPlaces] = useState(false);\n  const [livePlaces, setLivePlaces] = useState<Place[]>([]);\n', '  const [mapLoadState, setMapLoadState] = useState<MapLoadState>(mapboxToken ? "idle" : "missing");\n  const [loadingPlaces, setLoadingPlaces] = useState(true);\n  const [databasePlaces, setDatabasePlaces] = useState<Place[]>(PLACES);\n  const [databaseSource, setDatabaseSource] = useState("embedded");\n  const [dataManagementOpen, setDataManagementOpen] = useState(false);\n')

          s = re.sub(r'  const mapEl = useRef<HTMLDivElement \| null>\(null\);\n  const mapRef = useRef<any>\(null\);\n  const markersRef = useRef<any\[]>\(\[]\);\n  const clustererRef = useRef<MarkerClusterer \| null>\(null\);\n  const radiusCircleRef = useRef<any>\(null\);\n  const routeLineRef = useRef<any>\(null\);\n  const mapIdleListenerRef = useRef<any>\(null\);\n  const programmaticMapMoveRef = useRef\(false\);\n  const requestIdRef = useRef\(0\);\n', '', s)

          # Replace all automatic Google loader/search effects with one database load.
          start = s.find('  useEffect(() => {\n    const shouldLoad = tab === "map"')
          end = s.find('  const visiblePlaces = useMemo(() => {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate automatic external POI block')
          database_block = '''  async function reloadDatabase() {\n    setLoadingPlaces(true);\n    try {\n      const result = await loadPlacesFromDatabase();\n      setDatabasePlaces(result.places);\n      setDatabaseSource(result.source);\n      if (result.warning) showToast(result.warning, "removed");\n    } finally {\n      setLoadingPlaces(false);\n    }\n  }\n\n  useEffect(() => {\n    void reloadDatabase();\n  }, []);\n\n  const allPlaces = useMemo(() => databasePlaces.map((place) => withDistance(place, origin)), [databasePlaces, origin]);\n\n'''
          s = s[:start] + database_block + s[end:]

          # Current-location recenter no longer calls Google map instance methods.
          s = re.sub(r'  function handleMapLocate\(\) \{.*?\n  \}\n\n\n  function useCustomHomeLocation', '''  function handleMapLocate() {\n    setPendingMapCenter(null);\n    setShowSearchArea(false);\n    if (originMode !== "me") {\n      useMyLocation();\n      return;\n    }\n    setMapSearchCenter(origin);\n    setSelectedPlace(null);\n  }\n\n  function useCustomHomeLocation''', s, flags=re.S)

          # Remove Google Maps rendering effect. MapboxMap owns map lifecycle.
          start = s.find('  useEffect(() => {\n    if (tab !== "map" || !apiReady')
          end = s.find('  const navItems = [', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate Google map rendering effect')
          s = s[:start] + s[end:]

          # Replace Map canvas/fallback block with Mapbox renderer + resilient status overlay.
          start_anchor = '                {mapLoadState === "ready" ? <div ref={mapEl} className="absolute inset-0 bg-[#02060D]" /> : mapLoadState === "loading" ? ('
          start = s.find(start_anchor)
          end_anchor = '\n\n                <div className="absolute left-1/2 top-4 z-20 -translate-x-1/2">'
          end = s.find(end_anchor, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate map JSX block')
          mapbox_block = '''                {mapboxToken ? (\n                  <>\n                    <MapboxMap\n                      token={mapboxToken}\n                      places={mapVisiblePlaces}\n                      origin={origin}\n                      radiusMeters={radiusMeters}\n                      selectedPlace={selectedPlace}\n                      center={mapSearchCenter}\n                      onSelectPlace={(place) => { addRecent(place); setSelectedPlace(place); }}\n                      onMoveEnd={(next) => {\n                        const moved = Math.abs(next.lat - mapSearchCenter.lat) > 0.0008 || Math.abs(next.lng - mapSearchCenter.lng) > 0.0008;\n                        if (moved) { setPendingMapCenter(next); setShowSearchArea(true); }\n                      }}\n                      onStateChange={(state) => setMapLoadState(state)}\n                    />\n                    {(mapLoadState === "idle" || mapLoadState === "loading") && <div className="pointer-events-none absolute inset-0 z-10 grid place-items-center bg-[#02060D]/55 backdrop-blur-[2px]"><div className="amd-glass flex items-center gap-2 rounded-full px-4 py-2 text-[10px] text-[var(--amd-text-2)]"><LoaderCircle className="h-4 w-4 animate-spin text-[#00D9FF]" />{settings.language === "en" ? "Loading Mapbox" : "กำลังโหลด Mapbox"}</div></div>}\n                    {mapLoadState === "error" && <div className="absolute bottom-5 left-4 right-4 z-10"><div className="amd-glass-strong amd-card max-w-[320px] p-4 text-left"><p className="text-[12px] font-semibold">{settings.language === "en" ? "Mapbox could not load" : "โหลด Mapbox ไม่สำเร็จ"}</p><p className="mt-1 text-[9px] leading-4 text-[var(--amd-text-2)]">{settings.language === "en" ? "Place data remains available from the Around My Dorm database." : "ข้อมูลร้านยังใช้งานได้จากฐานข้อมูล Around My Dorm"}</p></div></div>}\n                  </>\n                ) : (\n                  <div className="amd-hero-map amd-map-fallback rounded-none border-0">\n                    <MiniMapArtwork />\n                    <div className="absolute bottom-5 left-4 right-4 z-10"><div className="amd-glass-strong amd-card max-w-[320px] p-4 text-left"><div className="flex items-start gap-3"><MapIcon className="mt-0.5 h-6 w-6 shrink-0 text-[#00D9FF]" /><div><p className="text-[12px] font-semibold">{settings.language === "en" ? "Mapbox is not configured" : "ยังไม่ได้ตั้งค่า Mapbox"}</p><p className="mt-1 text-[9px] leading-4 text-[var(--amd-text-2)]">Add NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN to Cloudflare build variables.</p></div></div></div></div>\n                  </div>\n                )}'''
          s = s[:start] + mapbox_block + s[end:]

          s = s.replace('onClick={() => { programmaticMapMoveRef.current = true; setMapSearchCenter(pendingMapCenter); setPendingMapCenter(null); setSelectedPlace(null); setShowSearchArea(false); }}', 'onClick={() => { setMapSearchCenter(pendingMapCenter); setPendingMapCenter(null); setSelectedPlace(null); setShowSearchArea(false); }}')

          # Data Management lives under Settings, not the normal Explore surface.
          help_anchor = '              <section className="amd-glass amd-card mt-4 px-4">\n                <SettingRow icon={<HelpCircle className="h-5 w-5" />}'
          data_section = '''              <section className="amd-glass amd-card mt-4 px-4">\n                <SettingRow icon={<Database className="h-5 w-5" />} title={settings.language === "en" ? "Data Management" : "จัดการข้อมูลร้าน"} subtitle={settings.language === "en" ? `Database: ${databaseSource} • ${allPlaces.length} places` : `ฐานข้อมูล: ${databaseSource} • ${allPlaces.length} สถานที่`} action={<button type="button" onClick={() => setDataManagementOpen(true)} className="flex items-center gap-1 text-[11px] font-semibold text-[#149CFF]">{settings.language === "en" ? "Manage" : "จัดการ"} <ChevronRight className="h-4 w-4" /></button>} />\n              </section>\n\n'''
          if help_anchor in s and 'title={settings.language === "en" ? "Data Management"' not in s:
              s = s.replace(help_anchor, data_section + help_anchor)

          overlay_anchor = '      {filterOpen && <FilterSheet'
          if overlay_anchor in s and '{dataManagementOpen && <DataManagement' not in s:
              s = s.replace(overlay_anchor, '      {dataManagementOpen && <DataManagement places={allPlaces} databaseSource={databaseSource} language={settings.language} onClose={() => setDataManagementOpen(false)} onReload={() => { void reloadDatabase(); }} />}\n' + overlay_anchor)

          p.write_text(s)

      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Validate data
        run: npm run validate:data
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .env.example app/globals.css types/place.ts components/MapboxMap.tsx components/AroundMyDormApp.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Migrate runtime to Mapbox database-first architecture"
            git push
          fi
