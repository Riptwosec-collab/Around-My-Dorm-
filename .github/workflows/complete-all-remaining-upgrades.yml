name: Persist Validated App Refactor

on:
  push:
    paths:
      - .github/workflows/complete-all-remaining-upgrades.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-validated-app-refactor
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply validated app decomposition
        run: python3 scripts/finish-all-remaining.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and architecture tests
        run: npm test

      - name: Validate all place data
        run: npm run validate:data

      - name: Production build
        run: npm run build

      - name: Commit app refactor only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AroundMyDormApp.tsx
          if git diff --cached --quiet; then
            echo "App refactor already persisted."
            exit 0
          fi
          git commit -m "Persist validated AroundMyDormApp decomposition"
          git push
