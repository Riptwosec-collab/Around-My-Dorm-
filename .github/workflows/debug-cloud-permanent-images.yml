name: Debug Cloud Permanent Images

on:
  push:
    branches:
      - feature/cloud-permanent-images
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Full suite without CI env
        continue-on-error: true
        run: npm test
      - name: Full suite with Build Check CI env
        id: ci-tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          CI=true npm test 2>&1 | tee ci-test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload CI test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-permanent-images-ci-test-output
          path: ci-test-output.log
          if-no-files-found: warn
      - name: Type check diagnostic
        continue-on-error: true
        run: CI=true npm run typecheck
