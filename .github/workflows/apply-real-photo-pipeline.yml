name: Apply Real Photo Pipeline

on:
  push:
    paths:
      - '.github/workflows/apply-real-photo-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch centralized photo pipeline into app
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # 1) Place image metadata model
          p = Path('types/place.ts')
          s = p.read_text()
          if 'export type PlaceImage =' not in s:
              marker = 'export type DeliveryPlatform = {'
              image_type = '''export type PlaceImage = {\n  url: string;\n  source: "google_places" | "official_website" | "seed" | "official_social" | "fallback";\n  photoReference?: string | null;\n  attribution?: string | null;\n  width?: number | null;\n  height?: number | null;\n  verified?: boolean;\n};\n\n'''
              s = s.replace(marker, image_type + marker)
          s = s.replace('  imageSource?: string | null;\n', '  imageSource?: string | null;\n  imageAttribution?: string | null;\n  imageVerifiedAt?: string | null;\n  imageMetadata?: PlaceImage[];\n')
          p.write_text(s)

          # 2) Persistent one-time enrichment overlay
          Path('data/places-product.ts').write_text('''import { PLACES as EXPANDED_PLACES } from "./places-expanded";\nimport { enrichPlace } from "./enrichments";\nimport imageEnrichment from "./place-image-enrichment.json";\nimport type { Place } from "@/types/place";\n\ntype ImagePatch = Partial<Pick<Place, "googlePlaceId" | "coverImage" | "image" | "images" | "galleryImages" | "imageSource" | "imageAttribution" | "imageVerifiedAt" | "imageMetadata">>;\nconst PHOTO_ENRICHMENTS = imageEnrichment as Record<string, ImagePatch>;\n\nfunction applyPhotoEnrichment(place: Place): Place {\n  const patch = PHOTO_ENRICHMENTS[place.id];\n  if (!patch) return place;\n  return {\n    ...place,\n    ...patch,\n    images: patch.images?.length ? patch.images : place.images,\n    galleryImages: patch.galleryImages?.length ? patch.galleryImages : place.galleryImages,\n    source: Array.from(new Set([...(place.source || []), patch.imageSource || "Photo enrichment layer"])),\n  };\n}\n\nexport const PLACES: Place[] = EXPANDED_PLACES.map(enrichPlace).map(applyPhotoEnrichment);\n''')

          # 3) Google live photo mapping, best-photo selection + metadata
          p = Path('lib/google-maps.ts')
          s = p.read_text()
          s = s.replace('import type { CategoryId, OpeningHours, Place } from "@/types/place";', 'import type { CategoryId, OpeningHours, Place, PlaceImage } from "@/types/place";\nimport { selectBestPlaceImage } from "@/lib/place-images";')
          old = '''  let image: string | null = null;\n  try {\n    image = raw.photos?.[0]?.getURI?.({ maxWidth: 1000, maxHeight: 720 }) || null;\n  } catch {}\n'''
          new = '''  const imageMetadata: PlaceImage[] = (raw.photos || []).slice(0, 8).map((photo: any) => {\n    let url = "";\n    try { url = photo.getURI?.({ maxWidth: 1200, maxHeight: 900 }) || ""; } catch {}\n    const attribution = Array.isArray(photo.authorAttributions)\n      ? photo.authorAttributions.map((item: any) => item.displayName).filter(Boolean).join(", ")\n      : null;\n    return {\n      url,\n      source: "google_places" as const,\n      photoReference: photo.name || null,\n      attribution: attribution || null,\n      width: typeof photo.widthPx === "number" ? photo.widthPx : null,\n      height: typeof photo.heightPx === "number" ? photo.heightPx : null,\n      verified: true,\n    };\n  }).filter((photo: PlaceImage) => Boolean(photo.url));\n  const provisional = { imageMetadata } as Place;\n  const bestPhoto = selectBestPlaceImage(provisional);\n  const image = bestPhoto?.url || null;\n'''
          if old in s:
              s = s.replace(old, new)
          s = s.replace('    image,\n    images: image ? [image] : [],\n', '    image,\n    coverImage: image,\n    images: imageMetadata.map((photo) => photo.url),\n    galleryImages: imageMetadata.map((photo) => photo.url),\n    imageSource: image ? "Google Places" : null,\n    imageAttribution: bestPhoto?.attribution ?? null,\n    imageVerifiedAt: image ? new Date().toISOString().slice(0, 10) : null,\n    imageMetadata,\n')
          p.write_text(s)

          # 4) Merge live photos without discarding verified seed metadata
          p = Path('components/AroundMyDormApp.tsx')
          s = p.read_text()
          if 'mergePlaceImageData' not in s:
              s = s.replace('import { LEGACY_DARK_MAP_STYLES } from "@/lib/map-style";', 'import { LEGACY_DARK_MAP_STYLES } from "@/lib/map-style";\nimport { mergePlaceImageData } from "@/lib/place-images";')
          old = '''      image: live.image || seed.image,\n      images: live.images.length ? live.images : seed.images,\n'''
          new = '''      image: live.image || seed.image,\n      coverImage: live.coverImage || seed.coverImage || seed.image,\n      images: live.images.length ? live.images : seed.images,\n      galleryImages: live.galleryImages?.length ? live.galleryImages : seed.galleryImages ?? seed.images,\n      imageSource: live.imageSource || seed.imageSource,\n      imageAttribution: live.imageAttribution || seed.imageAttribution,\n      imageVerifiedAt: live.imageVerifiedAt || seed.imageVerifiedAt,\n      imageMetadata: live.imageMetadata?.length ? live.imageMetadata : seed.imageMetadata,\n'''
          s = s.replace(old, new)
          # wrap merged seed/live record through centralized resolver
          pattern = re.compile(r'(const merged = seedPlaces\.map\(\(seed\) => \{.*?if \(!live\) return seed;.*?used\.add\(live\.id\);\n    return \{)(.*?)(\n    \} satisfies Place;\n  \}\);)', re.S)
          m = pattern.search(s)
          if m and 'mergePlaceImageData(seed' not in m.group(0):
              body = m.group(2)
              replacement = m.group(1).replace('return {', 'return mergePlaceImageData(seed, {') + body + '\n    } satisfies Place);\n  });'
              s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)

          # 5) Central resilient image component in PlaceCard
          p = Path('components/PlaceCard.tsx')
          s = p.read_text()
          if 'PlacePhoto' not in s:
              s = s.replace('import { CATEGORY_MAP } from "@/data/categories";', 'import { CATEGORY_MAP } from "@/data/categories";\nimport { PlacePhoto } from "@/components/PlacePhoto";')
          start = s.find('          {place.coverImage || place.image ? (')
          end = s.find('          <button\n            type="button"', start)
          if start != -1 and end != -1:
              block = '''          <PlacePhoto place={place} fallbackLabel={copy.unknownData} className="h-full min-h-[154px] w-full object-cover contrast-[.98] saturate-[.94]" />\n          <div className="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-black/[0.04]" />\n'''
              s = s[:start] + block + s[end:]
          p.write_text(s)

          # 6) Central resilient image component in MapBottomSheet
          p = Path('components/MapBottomSheet.tsx')
          s = p.read_text()
          if 'PlacePhoto' not in s:
              s = s.replace('import { CATEGORY_MAP } from "@/data/categories";', 'import { CATEGORY_MAP } from "@/data/categories";\nimport { PlacePhoto } from "@/components/PlacePhoto";')
          pattern = re.compile(r'        \{place\.coverImage \|\| place\.image \? \(.*?        \) : \(.*?        \)\}\n', re.S)
          s, _ = pattern.subn('        <div className={`${imageSize} relative shrink-0 overflow-hidden rounded-[16px] transition-[width,height] duration-[var(--motion-normal)]`}><PlacePhoto place={place} className="h-full w-full object-cover" /></div>\n', s, count=1)
          p.write_text(s)

          # 7) Place Detail hero + real gallery
          p = Path('components/PlaceDetail.tsx')
          s = p.read_text()
          if 'PlacePhoto' not in s:
              s = s.replace('import { ReportPlaceSheet } from "@/components/ReportPlaceSheet";', 'import { ReportPlaceSheet } from "@/components/ReportPlaceSheet";\nimport { PlacePhoto, PlacePhotoAttribution } from "@/components/PlacePhoto";')
          pattern = re.compile(r'            \{place\.coverImage \|\| place\.image \? \(.*?            \) : \(.*?            \)\}\n', re.S)
          s, _ = pattern.subn('            <PlacePhoto place={place} eager className="h-full w-full object-cover" fallbackLabel={copy.unknownData} />\n', s, count=1)
          gallery_anchor = '            <div className="mt-5 rounded-[24px] border border-white/[0.07] bg-white/[0.035] p-4">\n              <p className="text-[10px] font-bold uppercase tracking-[0.16em] text-white/35">{copy.aboutPlace}</p>'
          if 'รูปภาพสถานที่' not in s and gallery_anchor in s:
              gallery_block = '''            {gallery.length > 1 && (\n              <div className="mt-4">\n                <div className="mb-2 flex items-center justify-between"><p className="text-[11px] font-bold">{language === "en" ? "Place photos" : "รูปภาพสถานที่"}</p><span className="text-[9px] text-[var(--amd-text-3)]">{gallery.slice(0, 8).length} {language === "en" ? "photos" : "รูป"}</span></div>\n                <div className="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">\n                  {gallery.slice(0, 8).map((url, index) => <img key={`${url}-${index}`} src={url} alt={`${place.name} ${index + 1}`} loading="lazy" decoding="async" className="h-28 w-40 shrink-0 rounded-[16px] object-cover" />)}\n                </div>\n                <div className="mt-2"><PlacePhotoAttribution place={place} /></div>\n              </div>\n            )}\n\n'''
              s = s.replace(gallery_anchor, gallery_block + gallery_anchor)
          p.write_text(s)

          # 8) Package command
          p = Path('package.json')
          package = json.loads(p.read_text())
          package['scripts']['enrich:images'] = 'tsx scripts/enrich-existing-place-images.ts'
          p.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Validate data
        run: npm run validate:data
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit real photo pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types/place.ts data/places-product.ts lib/google-maps.ts components/AroundMyDormApp.tsx components/PlaceCard.tsx components/MapBottomSheet.tsx components/PlaceDetail.tsx package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Integrate real business photo enrichment pipeline"
            git push
          fi
