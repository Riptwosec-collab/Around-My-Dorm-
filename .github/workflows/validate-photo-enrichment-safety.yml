name: Validate Photo Enrichment Safety

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-photo-enrichment-safety.yml'

jobs:
  validate-photo-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Preview one-time enrichment with zero external requests
        run: npm run enrich:images:estimate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and architecture tests
        run: npm test
      - name: Validate place data
        run: npm run validate:data
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify normal browsing sends zero Google Places requests
        run: npx playwright test e2e/p0-google-api-lock.spec.ts --workers=1 --timeout=45000
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
