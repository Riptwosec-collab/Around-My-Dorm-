name: Add Visible Admin Login

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-visible-admin-login.py'
      - '.github/workflows/add-visible-admin-login.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-visible-admin-login-main
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visible admin login patch
        run: python3 scripts/add-visible-admin-login.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted admin login test
        run: npx vitest run tests/data-management-admin-gate.test.ts
      - name: Full unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/AroundMyDormApp.tsx tests/data-management-admin-gate.test.ts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: show Admin Login directly in Settings'
          git push origin main
