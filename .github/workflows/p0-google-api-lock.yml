name: P0 Google API Hard Lock

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-p0-google-api-lock.py'
      - 'scripts/fix-p0-google-api-lock-tests.py'
      - '.github/workflows/p0-google-api-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  google-api-lock:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply hard Google API lock
        run: python3 scripts/apply-p0-google-api-lock.py
      - name: Align existing API Control tests
        run: python3 scripts/fix-p0-google-api-lock-tests.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate place data
        run: npm run validate:data
      - name: Unit tests and architecture guard
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile hard-lock safety test
        run: npx playwright test e2e/p0-google-api-lock.spec.ts
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated hard lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/GoogleMaintenancePanel.tsx components/GooglePlaceIdManager.tsx lib/google-api-control.ts lib/google-request-manager.ts tests/google-api-control.test.ts tests/google-api-lock.test.ts tests/google-request-architecture.test.ts e2e/p0-google-api-lock.spec.ts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Implement P0 hard Google API request lock'
          git push origin main
